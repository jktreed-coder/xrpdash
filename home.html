<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="300">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<!-- Tizen-Safe Legacy Charting Component Bundle -->
<script src="https://jsdelivr.net"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --surface: #111113;
    --surface2: #18181b;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0ede8;
    --muted: #7a7872;
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.12);
    --green: #4caf85;
    --red: #e05c5c;
    --blue: #5b9bd5;
    --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-weight: 300;
    line-height: 1.5;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    padding: 1.5rem;
  }

  .xrp-greeting-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-shrink: 0;
  }

  .greeting {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .header-time {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1.2fr 0.8fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
    min-height: 0;
  }

  #panel-xrp { grid-column: 1 / -1; grid-row: 1; }
  #panel-weather { grid-column: 1; grid-row: 2; }
  #panel-news { grid-column: 2; grid-row: 2; }

  .panel {
    background: var(--bg);
    padding: 1.25rem 1.75rem;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-label {
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .panel-label::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
  }

  .dot-live { background: var(--green); width: 6px; height: 6px; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* XRP Frame Setup */
  .xrp-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.25rem;
    flex-shrink: 0;
  }

  .xrp-price-row {
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }

  .xrp-price {
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    font-weight: 500;
  }

  .badge-green { background: rgba(76,175,133,0.15); color: var(--green); }
  .badge-red   { background: rgba(224,92,92,0.15);  color: var(--red); }

  .xrp-meta {
    display: flex;
    gap: 2rem;
    align-items: baseline;
    margin-bottom: 0.5rem;
    flex-shrink: 0;
  }

  .xrp-meta-item { font-size: 0.72rem; color: var(--muted); }
  .xrp-meta-val  { color: var(--text); font-weight: 500; margin-left: 0.3rem; }

  .xrp-chart-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
    width: 100%;
  }

  .xrp-chart-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }

  /* Weather UI Setup */
  .weather-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    height: 100%;
  }
  .wx-temp { font-size: 2.5rem; font-weight: 700; color: #fff; line-height: 1; }
  .wx-desc { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-top: 0.25rem; }

  /* News Interface Setup */
  .news-container { display: flex; flex-direction: column; gap: 0.5rem; overflow: hidden; height: 100%; justify-content: center; }
  .news-item { font-size: 0.8rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news-time { font-size: 0.6rem; color: var(--muted); margin-bottom: 0.1rem; }
</style>
</head>
<body>

<div class="xrp-greeting-row">
  <div class="greeting">System Metrics Dashboard</div>
  <div id="live-clock" class="header-time">Initializing Terminal...</div>
</div>

<main>
  <!-- XRP Component -->
  <div id="panel-xrp" class="panel">
    <div class="panel-label">XRP TO USD <span class="dot-live"></span></div>
    <div class="xrp-header">
      <div class="xrp-price-row">
        <span id="xrp-price" class="xrp-price">$--.----</span>
        <span id="xrp-badge" class="badge">--%</span>
      </div>
    </div>
    <div class="xrp-meta">
      <div class="xrp-meta-item">24H HIGH <span id="xrp-high" class="xrp-meta-val">--</span></div>
      <div class="xrp-meta-item">24H LOW <span id="xrp-low" class="xrp-meta-val">--</span></div>
    </div>
    <div class="xrp-chart-wrap">
      <canvas id="xrpChart"></canvas>
    </div>
  </div>

  <!-- Weather Component -->
  <div id="panel-weather" class="panel">
    <div class="panel-label">Local Environment Metrics</div>
    <div class="weather-container">
      <div id="weather-temp" class="wx-temp">--°C</div>
      <div id="weather-desc" class="wx-desc">Awaiting sensor uplink...</div>
    </div>
  </div>

  <!-- News Feed Component -->
  <div id="panel-news" class="panel">
    <div class="panel-label">Global Bulletins</div>
    <div id="news-list" class="news-container">
      <div class="news-item">Awaiting news satellite network connection...</div>
    </div>
  </div>
</main>

<script>
  // Global reference variable for Tizen chart disposal properties
  var activeChartInstance = null;

  // 1. Clock Engine Sync
  function updateClock() {
    var dateObject = new Date();
    document.getElementById("live-clock").innerHTML = dateObject.toLocaleDateString() + " &mdash; " + dateObject.toLocaleTimeString();
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. Tizen-Compliant Cryptographic Processing
  function grabCryptoMetrics() {
    var xhrObj = new XMLHttpRequest();
    var queryPath = "https://coingecko.com";
    
    xhrObj.open("GET", queryPath, true);
    xhrObj.onreadystatechange = function () {
      if (xhrObj.readyState === 4 && jsonObjIsValid(xhrObj.status)) {
        try {
          var parsedObj = JSON.parse(xhrObj.responseText);
          var mData = parsedObj.market_data;
          
          var activePrice = mData.current_price.usd;
          var variance = mData.price_change_percentage_24h;
          var peakVal = mData.high_24h.usd;
          var floorVal = mData.low_24h.usd;
          var trackingTrendLine = mData.sparkline_7d.price;

          document.getElementById("xrp-price").innerHTML = "$" + activePrice.toFixed(4);
          document.getElementById("xrp-high").innerHTML = "$" + peakVal.toFixed(4);
          document.getElementById("xrp-low").innerHTML = "$" + floorVal.toFixed(4);
          
          var changeBadge = document.getElementById("xrp-badge");
          changeBadge.innerHTML = (variance >= 0 ? "+" : "") + variance.toFixed(2) + "%";
          changeBadge.className = variance >= 0 ? "badge badge-green" : "badge badge-red";

          generateLegacyChart(trackingTrendLine, variance >= 0 ? "#4caf85" : "#e05c5c");
        } catch (jsonErr) {
          console.log("XRP Render Fail: ", jsonErr);
        }
      }
    };
    xhrObj.send();
  }

  function generateLegacyChart(dataArray, colorHex) {
    var contextRef = document.getElementById('xrpChart').getContext('2d');
    var virtualXLabels = [];
    for (var positionIdx = 0; positionIdx < dataArray.length; positionIdx++) {
      virtualXLabels.push("");
    }

    if (activeChartInstance) {
      activeChartInstance.destroy(); // Flushes cached DOM data nodes out of active hardware memory
    }

    activeChartInstance = new Chart(contextRef, {
      type: 'line',
      data: {
        labels: virtualXLabels,
        datasets: [{
          data: dataArray,
          borderColor: colorHex,
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
          lineTension: 0.1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        legend: { display: false },
        elements: { point: { radius: 0 } },
        scales: {
          xAxes: [{ display: false, gridLines: { display: false } }],
          yAxes: [{ display: false, gridLines: { display: false } }]
        }
      }
    });
  }

  // 3. Tizen-Compliant Open-Meteo Processing Engine
  function grabWeatherMetrics() {
    var xhrObj = new XMLHttpRequest();
    var targetCoordinatesUrl = "https://open-meteo.com"; // Set to Oslo/Bærum coordinates
    
    xhrObj.open("GET", targetCoordinatesUrl, true);
    xhrObj.onreadystatechange = function () {
      if (xhrObj.readyState === 4 && jsonObjIsValid(xhrObj.status)) {
        try {
          var structuralPayload = JSON.parse(xhrObj.responseText);
          var activeConditions = structuralPayload.current_weather;
          document.getElementById("weather-temp").innerHTML = activeConditions.temperature + "°C";
          document.getElementById("weather-desc").innerHTML = "Wind Velocity: " + activeConditions.windspeed + " km/h";
